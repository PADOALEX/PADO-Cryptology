name: Build and test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Release / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    env:
      DOTNET_NOLOGO: 'true'
      DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
    steps:
      - uses: actions/checkout@v4
      - name: Install .NET 10 and the repository SDK baseline
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          global-json-file: global.json
      - name: SDK details
        run: dotnet --info
      - name: Restore
        run: dotnet restore PADO.Cryptology.sln
      - name: Build Release
        run: dotnet build PADO.Cryptology.sln --configuration Release --no-restore
      - name: Test Release
        run: dotnet test PADO.Cryptology.sln --configuration Release --no-build --logger trx --results-directory TestResults
      - name: CLI help
        run: dotnet run --project src/Cryptology.Cli/Cryptology.Cli.csproj --configuration Release --no-build -- --help
      - name: CLI vertical-slice demo
        run: dotnet run --project src/Cryptology.Cli/Cryptology.Cli.csproj --configuration Release --no-build -- demo
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: TestResults/*.trx
          if-no-files-found: ignore
